sylius_twig_hooks:
    hooks:
        # After the product info (gallery, summary, tabs), before the associations; in Sylius 1 the block
        # stood at priority 20 of sylius.shop.product.show.content, before the associations (10).
        'sylius_shop.product.show.content':
            viewed_products:
                template: '@VldmrkSyliusViewedProductsPlugin/_viewed_products.html.twig'
                priority: 50
